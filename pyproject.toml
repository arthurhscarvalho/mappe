[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mappe"
version = "1.0.0"
description = "Full-reference mesh quality assessment using point cloud and projection features."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "absl-py>=2.2.2",
    "lazypredict>=0.2.16",
    "matplotlib>=3.10.1",
    "mesh-projector==1.0.0",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "piq>=0.8.0",
    "pointpca2",
    "pointpca3==1.0.0",
    "psutil>=7.0.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "xgboost>=2.1.4",
    "xlsxwriter>=3.2.2",
]

[project.optional-dependencies]
rocm = [
    "torch>=2.6.0",
    "torchvision>=0.24.1",
    "pytorch-triton-rocm>=3.5.1",
]

[dependency-groups]
pypi-torch = [
    "torch>=2.6.0",
]
dev = [
    "ruff>=0.11.3",
]

[tool.uv]
default-groups = ["pypi-torch"]
conflicts = [
  [
    { group = "pypi-torch" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", extra = "rocm" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
torchvision = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
